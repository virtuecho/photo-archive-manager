[package]
name = "photo-archive-manager"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Offline photo organization, verification, backup, and archive desktop app"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "system_fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.17"
serde_json = "1"
sha2 = "0.11"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "compress"] }
zip = { version = "=9.2.2", default-features = false, features = ["deflate"] }
zeroize = "1"

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
strip = true
